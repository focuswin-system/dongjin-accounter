<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도니도라 - 회계관리</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="도니도라" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f172a"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 화면 설정 선적용 — **번들보다 먼저** 돈다.
         다크를 쓰는 사람이 앱을 열 때마다 흰 화면이 한 번 번쩍이는 것을 막는다
         (React 가 뜬 뒤에 붙이면 이미 흰 화면을 한 프레임 그린 뒤다).
         ⚠ 여기서 읽는 localStorage 는 사본이다. 진실은 로그인 뒤 서버 prefs 로 덮인다.
            규칙은 src/lib/theme.js applyTheme 과 같아야 한다 — 고칠 때 둘 다 고친다. -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('ui_theme') || '{}');
          var mode = t.mode === 'dark' || t.mode === 'light' ? t.mode
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var el = document.documentElement;
          el.setAttribute('data-theme', mode);
          el.setAttribute('data-accent', t.accent || 'gold');
          if (mode !== 'dark') {
            el.setAttribute('data-nav', t.nav || 'light');
            el.setAttribute('data-header', t.header || 'light');
          }
        } catch (e) { /* 저장소가 막혀 있어도 앱은 떠야 한다 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
