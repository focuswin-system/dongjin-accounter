<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/admin/logo.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<title>도니도라 운영 콘솔</title>
<!--
  운영자 콘솔 — 고객용 SPA(src/)와 **일부러 분리**했다.

  같은 번들에 넣으면 운영자 화면 코드가 모든 고객에게 배포된다. API는 LAN으로 막히지만,
  화면 구조·엔드포인트 이름까지 알려줄 이유가 없다. 의존성 없는 단일 파일이라
  빌드도 필요 없고 고객 번들에도 영향이 없다(폰트만 앱과 같은 Pretendard를 쓴다).
  로고는 src/assets 를 못 쓴다 — 거긴 Vite 번들이다. logo.png 를 같이 둔다.

  이 페이지 자체도 middleware/lanOnly 를 통과해야 열린다(index.js).

  ── 화면 원칙 ──
  운영자가 아침에 여는 화면이다. 알고 싶은 순서가 정해져 있다.
    "지금 문제 있나" → "어디가 문제인가" → "그래서 뭘 해야 하나"

  그래서 시각 요소를 아낀다.
    · **정상 상태에는 표식을 달지 않는다.** 전부 칠하면 아무것도 눈에 안 띈다.
      색과 배지는 '예외'에만 쓴다 — 0건이면 회색, 1건부터 색이 붙는다.
    · 굵기는 숫자와 제목에만. 본문까지 굵으면 강조가 사라진다.
    · 카드는 테두리·그림자 없이 배경 대비로만 띄운다(선을 겹쳐 그으면 지저분해진다).
-->
<style>
  :root{
    /* 회색조가 기본이다. 색은 의미가 있을 때만 꺼낸다. */
    --g900:#191F28; --g800:#333D4B; --g700:#4E5968; --g600:#6B7684;
    --g500:#8B95A1; --g400:#B0B8C1; --g300:#D1D6DB; --g200:#E5E8EB;
    --g100:#F2F4F6; --g50:#F9FAFB; --white:#FFFFFF;
    --blue:#3182F6; --blue-d:#1B64DA; --blue-l:#E8F3FF;
    --red:#F04452;  --red-l:#FEECEE;
    --amber:#FF9500; --amber-l:#FFF6E8;
    --green:#02B77A;
    --r:16px; --r-s:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--g50);color:var(--g900);
       font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
                   system-ui,"Apple SD Gothic Neo",sans-serif;
       font-size:15px;line-height:1.5;letter-spacing:-.02em;font-weight:400;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:13px;letter-spacing:0}
  .g5{color:var(--g500)} .g6{color:var(--g600)} .g7{color:var(--g700)}
  .red{color:var(--red)} .amber{color:var(--amber)}
  .row{display:flex;align-items:center;gap:10px} .grow{flex:1} .wrap{flex-wrap:wrap}
  .r{text-align:right}

  /* ── 헤더 ── */
  header.top{background:var(--white);border-bottom:1px solid var(--g100);position:sticky;top:0;z-index:30}
  .top-in{max-width:1160px;margin:0 auto;padding:16px 24px 0;display:flex;align-items:center;gap:12px}
  .top-in img{width:26px;height:26px;object-fit:contain}
  .b-t{font-size:16px;font-weight:600;letter-spacing:-.03em}
  .b-s{font-size:12px;color:var(--g500);margin-top:1px}
  nav.tabs{max-width:1160px;margin:0 auto;padding:0 24px;display:flex;gap:20px;overflow-x:auto}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 0 12px;
    font-family:inherit;font-size:15px;font-weight:500;color:var(--g500);cursor:pointer;
    white-space:nowrap;letter-spacing:-.02em;transition:color .12s}
  nav.tabs button:hover{color:var(--g700)}
  nav.tabs button.on{color:var(--g900);font-weight:600;border-bottom-color:var(--g900)}
  nav.tabs .pip{margin-left:5px;font-size:13px;font-weight:600;color:var(--red)}

  main{max-width:1160px;margin:0 auto;padding:24px 24px 80px}

  /* ── 요약 ── */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:24px}
  .kpi{background:var(--white);border-radius:var(--r);padding:20px 22px}
  .kpi .k{font-size:13px;color:var(--g500);font-weight:500}
  .kpi .v{font-size:30px;font-weight:700;letter-spacing:-.045em;margin-top:8px;line-height:1.1}
  .kpi .s{font-size:13px;color:var(--g500);margin-top:6px}

  /* ── 카드 ── */
  .card{background:var(--white);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
  .card > h2{margin:0;padding:20px 22px 4px;font-size:17px;font-weight:600;letter-spacing:-.03em;
             display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card > h2 .sub{font-size:13px;color:var(--g500);font-weight:400;letter-spacing:-.02em}
  .card > .pad{padding:16px 22px 22px}

  /* ── 표 ── */
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:620px}
  th{font-size:13px;font-weight:500;color:var(--g500);text-align:left;padding:14px 22px 12px;
     white-space:nowrap}
  td{font-size:15px;padding:16px 22px;border-top:1px solid var(--g100);vertical-align:middle}
  thead th{border-bottom:1px solid var(--g100)}
  tbody tr:first-child td{border-top:0}
  tbody tr.click{cursor:pointer;transition:background .1s}
  tbody tr.click:hover{background:var(--g50)}
  .sub-l{font-size:13px;color:var(--g500);margin-top:3px}
  .empty{padding:56px 22px;text-align:center;color:var(--g500);font-size:15px}

  /* ── 칩 ── 정상에는 안 붙인다. 예외에만. */
  .chip{display:inline-block;padding:3px 8px;border-radius:7px;font-size:12.5px;font-weight:600;
        letter-spacing:-.02em;background:var(--g100);color:var(--g600);white-space:nowrap}
  .chip.red{background:var(--red-l);color:var(--red)}
  .chip.amber{background:var(--amber-l);color:#C77700}
  .chip.blue{background:var(--blue-l);color:var(--blue-d)}

  /* ── 버튼 ── */
  .btn{background:var(--g100);color:var(--g700);border:0;border-radius:var(--r-s);
       padding:9px 14px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:-.02em;
       cursor:pointer;white-space:nowrap;transition:background .12s}
  .btn:hover{background:var(--g200)}
  .btn.pri{background:var(--blue);color:#fff}
  .btn.pri:hover{background:var(--blue-d)}
  .btn.dan{background:var(--red-l);color:var(--red)}
  .btn.dan:hover{background:#FCDCE0}
  .btn.sm{padding:7px 12px;font-size:13.5px}
  /* 고른 것 — 기간 선택처럼 여러 버튼 중 하나가 켜져 있는 자리에 쓴다.
     클래스만 붙이고 스타일이 없으면 지금 무엇을 보는지 알 수 없다. */
  .btn.on{background:var(--g900);color:#fff}
  .btn.on:hover{background:var(--g900)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:transparent;color:var(--g600)}
  .btn.ghost:hover{background:var(--g100)}

  /* ── 입력 ── */
  input,select{width:100%;background:var(--g100);color:var(--g900);border:1px solid transparent;
    border-radius:var(--r-s);padding:12px 14px;font-family:inherit;font-size:15px;letter-spacing:-.02em}
  input::placeholder{color:var(--g400)}
  input:focus,select:focus{outline:none;background:var(--white);border-color:var(--blue)}
  label{display:block;font-size:13px;font-weight:500;color:var(--g600);margin:0 0 7px}
  .field{margin-bottom:14px}

  /* ── 로그인 ──
   * 고객 로그인(src/screens/Login.jsx)과 같은 뼈대 — 좌측 브랜드 패널 + 우측 폼.
   * 다만 결은 다르게 둔다. 전 회사를 들여다보는 사내 도구라, 고객 화면과 구분이
   * 안 되면 "지금 어디에 로그인하는 건지" 헷갈리고 그 헷갈림이 곧 사고다. */
  .lg{display:flex;min-height:100vh;background:var(--white)}
  .lg-b{width:44%;flex-shrink:0;background:var(--g900);color:#fff;padding:44px 44px 32px;
        display:flex;flex-direction:column;position:relative;overflow:hidden}
  .lg-b .glow{position:absolute;border-radius:50%;pointer-events:none}
  .lg-b .glow.a{width:560px;height:560px;top:-200px;right:-180px;
    background:radial-gradient(circle,rgba(255,149,0,.16),rgba(255,149,0,0) 66%)}
  .lg-b .glow.b{width:420px;height:420px;bottom:-60px;left:-150px;
    background:radial-gradient(circle,rgba(49,130,246,.14),rgba(49,130,246,0) 66%)}
  .lg-top{display:flex;align-items:center;gap:9px;margin-bottom:auto;position:relative}
  .lg-top img{width:20px;height:20px;object-fit:contain}
  .lg-top span{font-size:14px;font-weight:600;color:rgba(255,255,255,.82);letter-spacing:-.02em}
  .lg-mid{margin-bottom:auto;position:relative}
  .lg-tag{display:inline-block;padding:5px 10px;border-radius:7px;font-size:12.5px;font-weight:600;
          background:rgba(255,255,255,.1);color:rgba(255,255,255,.78);margin-bottom:20px}
  .lg-h{font-size:40px;font-weight:700;letter-spacing:-.045em;line-height:1.2;color:#fff}
  .lg-s{font-size:16px;font-weight:400;color:rgba(255,255,255,.52);line-height:1.7;margin-top:18px}
  .lg-f{font-size:12.5px;color:rgba(255,255,255,.38);position:relative}
  .lg-r{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 40px}
  .lg-in{width:100%;max-width:340px}
  .lg-in h1{font-size:24px;font-weight:700;letter-spacing:-.04em;margin:0 0 8px}
  .lg-in .note{font-size:14px;color:var(--g500);margin:0 0 32px}
  .lg-in input{height:50px;padding:0 14px;background:var(--g50);border-color:var(--g200)}
  .lg-in input:focus{background:var(--white);border-color:var(--blue)}
  .pw{position:relative}
  .pw input{padding-right:46px}
  .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;
    cursor:pointer;color:var(--g400);display:grid;place-items:center;padding:6px;border-radius:8px}
  .pw button:hover{color:var(--g600);background:var(--g100)}
  .lg-err{display:flex;align-items:flex-start;gap:7px;padding:12px 14px;border-radius:var(--r-s);
          background:var(--red-l);color:var(--red);font-size:14px;margin-bottom:18px;line-height:1.5}
  .lg-in .btn{width:100%;height:52px;font-size:16px;border-radius:12px;margin-top:10px}
  .lg-hint{margin-top:20px;font-size:13px;color:var(--g500);line-height:1.65;text-align:center}

  /* ── 상세 패널 ── */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--g50);
          z-index:41;display:flex;flex-direction:column}
  .dr-h{padding:22px 24px;background:var(--white);border-bottom:1px solid var(--g100);
        display:flex;align-items:flex-start;gap:12px}
  .dr-b{padding:16px 24px 48px;overflow:auto}
  pre{margin:12px 0 0;white-space:pre-wrap;word-break:break-all;color:var(--g600);
      font:12.5px/1.75 ui-monospace,Menlo,Consolas,monospace;background:var(--g50);
      border-radius:var(--r-s);padding:14px 16px}

  /* ── 확인창 ── */
  .modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:24px;
         background:rgba(0,0,0,.28)}
  .modal .box{background:var(--white);border-radius:20px;padding:28px;width:100%;max-width:400px}
  .modal h3{margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:-.04em}
  .modal p{margin:0 0 20px;font-size:15px;color:var(--g700);line-height:1.6}
  .modal .err{color:var(--red);font-size:13.5px;min-height:19px;margin-bottom:4px}

  /* ── 알림 ── */
  .toasts{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:60;
          display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--g900);color:#fff;border-radius:12px;padding:14px 20px;font-size:14.5px;
         font-weight:500;letter-spacing:-.02em;box-shadow:0 6px 20px rgba(0,0,0,.16)}
  .toast.bad{background:var(--red)}

  .skel{height:15px;border-radius:8px;background:var(--g100)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .skel{animation:pulse 1.4s ease-in-out infinite}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ── 뼈대 ─────────────────────────────────────────────────────────── */
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild }
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
const root = document.getElementById('root')

/* 토큰은 sessionStorage 에 둔다 — 탭을 닫으면 사라진다.
   전 회사를 보는 세션이 브라우저에 영구히 남아 있을 이유가 없다. */
let token = sessionStorage.getItem('adminToken') || ''
let me = null

async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, {
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  })
  if (res.status === 401 || res.status === 403) { logout(); throw new Error('세션이 만료되었습니다') }
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || '요청에 실패했어요')
  return data
}
function logout() { token = ''; me = null; sessionStorage.removeItem('adminToken'); renderLogin() }

const toast = (msg, tone = '') => {
  const t = el(`<div class="toast ${tone}">${esc(msg)}</div>`)
  document.getElementById('toasts').appendChild(t)
  setTimeout(() => t.remove(), 3400)
}

/** 확인창 — 브라우저 confirm 은 문구를 다듬을 수 없고 위험도를 구분하지 못한다 */
const ask = ({ title, body, confirmLabel = '확인', danger = false, input = null }) => new Promise(resolve => {
  const m = el(`<div class="modal"><div class="box">
      <h3>${esc(title)}</h3>
      ${body ? `<p>${body}</p>` : ''}
      ${input ? `<div class="field"><label>${esc(input.label)}</label>
                 <input id="mi" type="${input.type || 'text'}" placeholder="${esc(input.placeholder || '')}"></div>` : ''}
      <div class="err" id="me"></div>
      <div class="row" style="justify-content:flex-end;gap:8px">
        <button class="btn" id="mc">취소</button>
        <button class="btn ${danger ? 'dan' : 'pri'}" id="mo">${esc(confirmLabel)}</button>
      </div></div></div>`)
  document.body.appendChild(m)
  const onKey = (e) => { if (e.key === 'Escape') close(null) }
  const close = (v) => { m.remove(); document.removeEventListener('keydown', onKey); resolve(v) }
  const submit = () => {
    if (!input) return close(true)
    const v = m.querySelector('#mi').value
    const bad = input.validate && input.validate(v)
    if (bad) { m.querySelector('#me').textContent = bad; return }
    close(v)
  }
  document.addEventListener('keydown', onKey)
  m.querySelector('#mc').onclick = () => close(null)
  m.querySelector('#mo').onclick = submit
  m.onclick = (e) => { if (e.target === m) close(null) }
  if (input) {
    const i = m.querySelector('#mi')
    i.focus(); i.onkeydown = (e) => { if (e.key === 'Enter') submit() }
  } else { m.querySelector('#mo').focus() }
})

/* ── 표시 도우미 ── */
const when = (v) => {
  if (!v) return '—'
  const d = new Date(v), p = (x) => String(x).padStart(2, '0')
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`
}
const ago = (v) => {
  if (!v) return '—'
  const m = Math.floor((Date.now() - new Date(v)) / 60000)
  if (m < 1) return '방금'
  if (m < 60) return m + '분 전'
  if (m < 1440) return Math.floor(m / 60) + '시간 전'
  const d = Math.floor(m / 1440)
  return d < 30 ? d + '일 전' : Math.floor(d / 30) + '개월 전'
}
const n = (v) => Number(v || 0).toLocaleString('ko-KR')
/** 0은 회색, 1부터 색 — 정상까지 칠하면 예외가 안 보인다 */
const mark = (v, cls) => (Number(v) > 0 ? `<span class="${cls}">${n(v)}</span>` : `<span class="g5">0</span>`)

/* ── 로그인 ───────────────────────────────────────────────────────── */
const EYE = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
const EYE_OFF = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
  <line x1="1" y1="1" x2="23" y2="23"/></svg>`
const WARN = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px">
  <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`

function renderLogin() {
  root.innerHTML = ''
  const v = el(`<div class="lg">
      <div class="lg-b">
        <div class="glow a"></div><div class="glow b"></div>
        <div class="lg-top"><img src="/admin/logo.png" alt=""><span>도니도라</span></div>
        <div class="lg-mid">
          <span class="lg-tag">사내 운영자 전용</span>
          <div class="lg-h">운영 콘솔</div>
          <div class="lg-s">테넌트 현황과 오류, 계정을<br>한 곳에서 관리합니다.</div>
        </div>
        <div class="lg-f">© 2026 (주)포커스윈</div>
      </div>

      <div class="lg-r"><div class="lg-in">
        <h1>운영자 로그인</h1>
        <div class="note">서비스 전체를 다루는 화면입니다.</div>
        <div id="alert"></div>
        <div class="field"><label>아이디</label>
          <input id="u" autocomplete="username" placeholder="아이디를 입력하세요" spellcheck="false"></div>
        <div class="field"><label>비밀번호</label>
          <div class="pw">
            <input id="p" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요">
            <button type="button" id="tp" aria-label="비밀번호 표시">${EYE_OFF}</button>
          </div></div>
        <button class="btn pri" id="go">로그인</button>
        <div class="lg-hint">사무실 네트워크에서만 열립니다.</div>
      </div></div>
    </div>`)
  root.appendChild(v)

  const pw = v.querySelector('#p'), tp = v.querySelector('#tp')
  tp.onclick = () => {
    const show = pw.type === 'password'
    pw.type = show ? 'text' : 'password'
    tp.innerHTML = show ? EYE : EYE_OFF
    pw.focus()
  }
  const showErr = (msg) => {
    v.querySelector('#alert').innerHTML = msg ? `<div class="lg-err">${WARN}<span>${esc(msg)}</span></div>` : ''
  }
  const go = async () => {
    const btn = v.querySelector('#go')
    showErr('')
    const username = v.querySelector('#u').value.trim()
    if (!username || !pw.value) { showErr('아이디와 비밀번호를 모두 입력해주세요.'); return }
    btn.disabled = true; btn.textContent = '로그인 중'
    try {
      const r = await fetch('/api/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password: pw.value }),
      })
      const d = await r.json().catch(() => ({}))
      if (!r.ok) { showErr(d.error || '로그인에 실패했어요'); return }
      token = d.token; me = d.admin; sessionStorage.setItem('adminToken', token)
      renderApp('overview')
    } catch { showErr('서버에 연결할 수 없습니다.') }
    finally { btn.disabled = false; btn.textContent = '로그인' }
  }
  v.querySelector('#go').onclick = go
  for (const id of ['#u', '#p']) v.querySelector(id).onkeydown = (ev) => { if (ev.key === 'Enter') go() }
  v.querySelector('#u').focus()
}

/** 묶음 안을 본다 — 묶어놓고 안을 못 보면 묶은 의미가 없다 */
async function openError(fp) {
  const scrim = el('<div class="scrim"></div>')
  const dr = el(`<aside class="drawer">
      <div class="dr-h"><div class="grow">
        <div style="font-size:18px;font-weight:600;letter-spacing:-.03em">오류 상세</div>
        <div class="g5" style="font-size:13px;margin-top:3px">최근 20건</div></div>
        <button class="btn sm" id="x">닫기</button></div>
      <div class="dr-b" id="b"><div class="empty">불러오는 중</div></div></aside>`)
  const onKey = (e) => { if (e.key === 'Escape') close() }
  const close = () => { scrim.remove(); dr.remove(); document.removeEventListener('keydown', onKey) }
  scrim.onclick = close
  dr.querySelector('#x').onclick = close
  document.addEventListener('keydown', onKey)
  document.body.append(scrim, dr)

  let d
  try { d = await api('/errors/' + encodeURIComponent(fp)) }
  catch (e) { dr.querySelector('#b').innerHTML = `<div class="empty red">${esc(e.message)}</div>`; return }

  dr.querySelector('#b').innerHTML = d.rows.map(r => `
      <div class="card"><div class="pad">
        <div class="row wrap" style="gap:8px">
          <span style="font-weight:600">${esc(r.company_code || '회사 미상')}</span>
          <span class="g5" style="font-size:13.5px">${esc(r.username || '비로그인')} · ${when(r.created_at)}</span>
          <div class="grow"></div>
          ${r.release_id ? `<span class="chip">${esc(String(r.release_id).slice(0, 8))}</span>` : ''}
        </div>
        <div class="mono" style="margin-top:12px">${esc(r.method || '')} ${esc(r.path || '')}
          <span class="g5">→ ${esc(r.status || '-')}</span></div>
        <div class="mono g7" style="margin-top:6px">${esc(r.code || '')} ${esc(r.message || '')}</div>
        ${r.stack ? `<pre>${esc(r.stack)}</pre>` : ''}
      </div></div>`).join('') || '<div class="empty">기록이 없습니다.</div>'
}

/* ── 사용 ──
 *
 * 이 화면이 답해야 할 물음은 둘이다.
 *   1) 이 회사, 아직 쓰고 있나?  (안 쓰기 시작하면 그때 연락해야 한다)
 *   2) 쓰다가 어디서 멈추나?     (목록만 오르내리고 등록·발행이 안 보이면 입력에서 막힌 것)
 * 남아 있는 값은 화면 이름·횟수뿐이라 회계 내용은 보이지 않는다.
 */
async function viewUsage(main) {
  const days = state.usageDays || 30
  const box = el(`<div class="card">
      <h2>사용 현황<span class="sub">최근 ${days}일</span>
        <span style="margin-left:auto;display:flex;gap:6px" id="dsel"></span></h2>
      <div id="body"><div class="empty">불러오는 중</div></div></div>`)
  main.appendChild(box)

  const dsel = box.querySelector('#dsel')
  for (const d of [7, 30, 90]) {
    const b = el(`<button class="btn sm ${d === days ? 'on' : ''}">${d}일</button>`)
    b.onclick = () => { state.usageDays = d; renderApp('usage') }
    dsel.appendChild(b)
  }

  let d
  try { d = await api(`/usage?days=${days}`) }
  catch (e) { box.querySelector('#body').innerHTML = `<div class="empty red">${esc(e.message)}</div>`; return }

  /* 며칠째 안 들어왔는지가 이 표의 핵심이다. 날짜만 적어두면 눈으로 빼야 해서
     "언제부터 안 쓰지"를 놓친다. */
  const daysAgo = (t) => {
    if (!t) return null
    return Math.floor((Date.now() - new Date(t).getTime()) / 86400000)
  }
  const tone = (ago) => ago == null ? 'red' : ago >= 14 ? 'red' : ago >= 7 ? 'amber' : ''
  const label = (ago) => ago == null ? '기록 없음' : ago === 0 ? '오늘' : `${ago}일 전`

  const crows = d.companies.map(c => {
    const ago = daysAgo(c.last_seen)
    return `<tr>
      <td><span style="font-weight:600">${esc(c.code)}</span>
          <div class="sub-l">${esc(c.name || '')}</div></td>
      <td><span class="chip ${tone(ago)}">${label(ago)}</span></td>
      <td class="num r">${n(c.active_users || 0)}</td>
      <td class="num r">${n(c.active_days || 0)}일</td>
      <td class="num r">${n(c.hits || 0)}</td>
    </tr>`
  }).join('')

  const urows = d.users.slice(0, 30).map(u => {
    const ago = daysAgo(u.last_seen)
    return `<tr>
      <td class="g6">${esc(u.company_code || '—')}</td>
      <td>${esc(u.username || '—')}</td>
      <td><span class="chip ${tone(ago)}">${label(ago)}</span></td>
      <td class="num r">${n(u.hits || 0)}</td>
    </tr>`
  }).join('')

  const top = Math.max(1, ...d.routes.map(r => Number(r.hits) || 0))
  const rrows = d.routes.slice(0, 20).map(r => `<tr>
      <td class="mono">${esc(r.route)}</td>
      <td style="width:50%">
        <div style="height:6px;border-radius:3px;background:var(--g900);opacity:.75;width:${
          Math.max(2, Math.round((Number(r.hits) || 0) / top * 100))}%"></div>
      </td>
      <td class="num r">${n(r.hits || 0)}</td>
      <td class="num r g6">${n(r.companies || 0)}개사</td>
    </tr>`).join('')

  box.querySelector('#body').innerHTML = `
    <div class="tw"><table><thead><tr>
      <th>회사</th><th>마지막 접속</th><th class="r">쓴 사람</th><th class="r">쓴 날</th><th class="r">화면 이동</th>
    </tr></thead><tbody>${crows || '<tr><td colspan="5" class="empty">기록이 없습니다.</td></tr>'}</tbody></table></div>

    <h2 style="margin-top:26px">사람별 마지막 접속</h2>
    <div class="tw"><table><thead><tr>
      <th>회사</th><th>아이디</th><th>마지막 접속</th><th class="r">화면 이동</th>
    </tr></thead><tbody>${urows || '<tr><td colspan="4" class="empty">기록이 없습니다.</td></tr>'}</tbody></table></div>

    <h2 style="margin-top:26px">많이 쓴 화면
      <span class="sub">등록·발행이 안 보이고 목록만 오르내리면 입력에서 막힌 것이다</span></h2>
    <div class="tw"><table><thead><tr>
      <th>화면</th><th></th><th class="r">이동</th><th class="r">쓰는 회사</th>
    </tr></thead><tbody>${rrows || '<tr><td colspan="4" class="empty">기록이 없습니다.</td></tr>'}</tbody></table></div>`
}

  let d
  try { d = await api(`/companies/${cid}/users`) }
  catch (e) { box.innerHTML = `<div class="empty red">${esc(e.message)}</div>`; return }

  const run = async (fn, okMsg) => {
    try { await fn(); toast(okMsg); renderApp('accounts') } catch (e) { toast(e.message, 'bad') }
  }

  const rows = d.rows.map(u => `<tr>
      <td><span style="font-weight:600">${esc(u.username)}</span>${
          u.role === 'admin' ? ' <span class="chip blue">마스터</span>' : ''}
          <div class="sub-l">${esc(u.name || '')}</div></td>
      <td>${u.active ? '<span class="g6">사용 중</span>' : '<span class="chip">정지</span>'}

      <td class="r num g6">${ago(u.last_login)}</td>
      <td class="r">${u.recent_fails >= 5
          ? `<span class="chip red">잠김 · ${n(u.recent_fails)}회</span>`
          : `<span class="num g5">${n(u.recent_fails)}</span>`}</td>
      <td class="r"><div class="row wrap" style="gap:6px;justify-content:flex-end">
        <button class="btn sm" data-pw="${esc(u.id)}" data-u="${esc(u.username)}">비밀번호</button>
        <button class="btn sm ${u.active ? 'dan' : ''}" data-act="${esc(u.id)}"
                data-on="${u.active ? '0' : '1'}" data-u="${esc(u.username)}">${u.active ? '정지' : '사용'}</button>
        ${u.recent_fails >= 5 ? `<button class="btn sm" data-unlock="${esc(u.id)}" data-u="${esc(u.username)}">잠금 해제</button>` : ''}
      </div></td>
    </tr>`).join('')

  box.innerHTML = `<h2>${esc(d.company.name)}<span class="sub">${esc(d.company.code)} · 계정 ${d.rows.length}개</span></h2>
    <div class="tw"><table><thead><tr>
      <th>아이디</th><th>상태</th><th class="r">마지막 로그인</th><th class="r">최근 실패</th><th></th>
    </tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">계정이 없습니다.</td></tr>'}</tbody></table></div>`

  box.querySelectorAll('[data-pw]').forEach(b => b.onclick = async () => {
    const who = b.getAttribute('data-u')
    const pw = await ask({
      title: '비밀번호 초기화',
      body: `<b>${esc(who)}</b> 의 비밀번호를 바꿉니다.<br>`
          + '이 작업은 해당 회사의 변경 이력에 운영자 이름으로 남고, '
          + '사용자는 다음 로그인 때 비밀번호를 다시 설정하게 됩니다.',
      confirmLabel: '초기화',
      input: {
        label: '임시 비밀번호 (8자 이상)', placeholder: '예: temp-2026-0804',
        validate: (v) => (v.length < 8 ? '8자 이상이어야 합니다' : null),
      },
    })
    if (pw == null) return
    run(() => api(`/companies/${cid}/users/${b.getAttribute('data-pw')}/password`,
                  { method: 'POST', body: { password: pw } }), `${who} 비밀번호를 초기화했습니다`)
  })

  box.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const on = b.getAttribute('data-on') === '1', who = b.getAttribute('data-u')
    const ok = await ask({
      title: on ? '계정 사용' : '계정 정지',
      body: on ? `<b>${esc(who)}</b> 계정으로 다시 로그인할 수 있게 됩니다.`
               : `<b>${esc(who)}</b> 계정은 로그인할 수 없게 됩니다.<br>남긴 기록은 그대로 유지됩니다.`,
      confirmLabel: on ? '사용' : '정지', danger: !on,
    })
    if (!ok) return
    run(() => api(`/companies/${cid}/users/${b.getAttribute('data-act')}/active`,
                  { method: 'PATCH', body: { active: on } }),
        on ? `${who} 계정을 사용 처리했습니다` : `${who} 계정을 정지했습니다`)
  })

  box.querySelectorAll('[data-unlock]').forEach(b => b.onclick = () =>
    run(() => api(`/companies/${cid}/users/${b.getAttribute('data-unlock')}/unlock`, { method: 'POST' }),
        `${b.getAttribute('data-u')} 의 로그인 잠금을 해제했습니다`))

  // 계정 추가
  const add = el(`<div class="card"><h2>계정 추가</h2><div class="pad">
      <div class="row wrap" style="align-items:flex-end;gap:12px">
        <div class="field" style="flex:1;min-width:140px;margin:0"><label>아이디</label><input id="nu"></div>
        <div class="field" style="flex:1;min-width:140px;margin:0"><label>이름</label><input id="nn"></div>
        <div class="field" style="flex:1;min-width:190px;margin:0"><label>임시 비밀번호</label>
          <input id="np" placeholder="8자 이상"></div>
        <div class="field" style="min-width:140px;margin:0"><label>역할</label>
          <select id="nr"><option value="user">일반 사용자</option><option value="admin">마스터</option></select></div>
        <button class="btn pri" id="go" style="height:44px">추가</button>
      </div>
      <div class="err" id="e" style="color:var(--red);font-size:13.5px;min-height:19px;margin-top:8px"></div>
      <div class="g5" style="font-size:13px">추가된 계정은 첫 로그인 때 비밀번호를 다시 설정하게 됩니다.</div>
    </div></div>`)
  add.querySelector('#go').onclick = () => {
    const e = add.querySelector('#e'); e.textContent = ''
    const body = {
      username: add.querySelector('#nu').value.trim(),
      name: add.querySelector('#nn').value.trim(),
      password: add.querySelector('#np').value,
      role: add.querySelector('#nr').value,
    }
    if (!body.username) { e.textContent = '아이디를 입력하세요'; return }
    if (body.password.length < 8) { e.textContent = '임시 비밀번호는 8자 이상이어야 합니다'; return }
    run(() => api(`/companies/${cid}/users`, { method: 'POST', body }), `${body.username} 계정을 만들었습니다`)
  }
  main.appendChild(add)
}

/* ── 기능 ──
 *
 * "이 회사에 이 보고서 양식을 열어준다". 켜는 건 **계약**이라 우리가 정할 일이고,
 * 그래서 고객 화면이 아니라 여기(LAN 안쪽 콘솔)에만 있다.
 *
 * 세 가지 상태를 구분해 보여준다 — 안 그러면 "켰는데 왜 안 보이지"가 난다.
 *   기본 제공  전 회사가 이미 본다. 켜고 끌 대상이 아니다
 *   판매 가능  여기서 켜고 끈다
 *   준비 중    화면은 있지만 아직 안 판다. 켜도 고객에게 안 나간다(서버가 막는다)
 */
async function viewFeatures(main, ov) {
  const cid = state.company || (ov.companies[0] && ov.companies[0].id)
  if (!cid) { main.appendChild(el('<div class="card"><div class="empty">회사가 없습니다.</div></div>')); return }
  state.company = cid

  const picker = el(`<div class="card"><div class="pad row wrap" style="padding:18px 22px">
      <label style="margin:0">회사</label>
      <select id="c" style="width:auto;min-width:260px">${ov.companies.map(c =>
        `<option value="${esc(c.id)}" ${c.id === cid ? 'selected' : ''}>${esc(c.code)} · ${esc(c.name)}</option>`).join('')}</select>
      <div class="grow"></div>
      <span class="g5" style="font-size:13px">변경은 해당 회사의 변경 이력에 남습니다</span>
    </div></div>`)
  picker.querySelector('#c').onchange = (e) => { state.company = e.target.value; renderApp('features') }
  main.appendChild(picker)

  const box = el('<div class="card"><div class="empty">불러오는 중</div></div>')
  main.appendChild(box)
  let d
  try { d = await api(`/companies/${cid}/features`) }
  catch (e) { box.innerHTML = `<div class="empty red">${esc(e.message)}</div>`; return }

  const run = async (fn, okMsg) => {
    try { await fn(); toast(okMsg); renderApp('features') } catch (e) { toast(e.message, 'bad') }
  }

  /* 세 가지를 구분해 보여준다 — 안 그러면 "켰는데 왜 안 보이지"가 난다.
   *   기본 제공  전 회사가 이미 본다. 켜고 끌 대상이 아니다
   *   선택 제공  여기서 켜고 끈다
   *   준비 중    화면은 있지만 아직 못 연다(서버가 409로 막는다) */
  const SCOPE = {
    all:      { label: '기본 제공', note: '전 회사가 이미 봅니다' },
    entitled: { label: '선택 제공', note: '켜 준 회사만 봅니다' },
    hidden:   { label: '준비 중',   note: '아직 열 수 없는 양식입니다' },
  }

  /* 상태 한 칸에 세 가지가 겹친다 — 계약(우리) · 기간 · 회사 설정.
   * 뭉치면 "사용 중인데 고객 화면엔 없다"를 못 읽으므로 갈라서 적는다. */
  const statusCell = (f) => {
    if (f.scope !== 'entitled') return '<span class="g5">—</span>'
    if (!f.on) return '<span class="g5">꺼짐</span>'
    if (!f.active) return '<span class="chip amber">기간 지남</span>'
    if (f.companyOff) return '<span class="chip amber">회사에서 끔</span>'
    return '<span class="chip blue">사용 중</span>'
  }

  const rowHtml = (f) => {
    const sc = SCOPE[f.scope] || SCOPE.hidden
    return `<tr>
      <td><span style="font-weight:600">${esc(f.label)}</span>
          <div class="sub-l">${esc(f.descr)}</div></td>
      <td>${statusCell(f)}</td>
      <td class="num g6">${f.expires_on ? esc(f.expires_on) + ' 까지' : (f.scope === 'entitled' && f.on ? '무기한' : '')}</td>
      <td class="g5" style="font-size:13px">${esc(f.memo || '')}</td>
      <td class="r">${f.scope === 'entitled'
        ? `<button class="btn sm ${f.on ? 'dan' : 'pri'}" data-k="${esc(f.key)}" data-on="${f.on ? '0' : '1'}"
                   data-l="${esc(f.label)}">${f.on ? '사용 중지' : '사용 시작'}</button>`
        : ''}</td>
    </tr>`
  }

  /* 구분별로 묶는다. 선택 제공을 맨 위에 둔다 — 여기서 할 일이 있는 건 그것뿐이다. */
  const ORDER = ['entitled', 'all', 'hidden']
  const groups = ORDER
    .map(k => ({ k, sc: SCOPE[k], list: d.items.filter(f => f.scope === k) }))
    .filter(g => g.list.length)

  const onCount = d.items.filter(f => f.scope === 'entitled' && f.active && !f.companyOff).length
  const sellable = d.items.filter(f => f.scope === 'entitled').length

  box.innerHTML = `<h2>${esc(d.company.name)}<span class="sub">${esc(d.company.code)} · 선택 제공 ${onCount}/${sellable} 사용 중</span></h2>
    <div class="tw"><table><thead><tr>
      <th>기능</th><th style="width:120px">상태</th><th style="width:150px">기간</th><th style="width:200px">메모</th><th style="width:120px"></th>
    </tr></thead><tbody>${groups.map(g => `
      <tr><td colspan="5" style="background:var(--bg2,#F7F8FA);font-weight:600;font-size:13px;padding:8px 14px">
        ${esc(g.sc.label)} <span class="g5" style="font-weight:400">· ${esc(g.sc.note)}</span>
      </td></tr>
      ${g.list.map(rowHtml).join('')}`).join('')}</tbody></table></div>
    <div class="pad g5" style="font-size:13px;padding-top:0">
      기능을 켜면 그 회사 사용자에게 바로 보입니다. 끄면 다시 보이지 않습니다.<br>
      <b>회사에서 끔</b>은 우리가 켜 줬지만 그 회사가 자기 설정(환경설정 &gt; 보고서)에서 껐다는 뜻입니다 — 그건 그 회사가 정할 일이라 여기서 대신 켜지 않습니다.<br>
      회계 내용은 이 화면에서 다루지 않습니다.
    </div>`

  box.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
    const on = b.getAttribute('data-on') === '1'
    const key = b.getAttribute('data-k'), label = b.getAttribute('data-l')
    if (on) {
      const memo = await ask({
        title: '기능 사용 시작',
        body: `<b>${esc(d.company.name)}</b> 에 <b>${esc(label)}</b> 을(를) 엽니다.<br>`
            + '그 회사 사용자에게 바로 보이게 됩니다. 이 변경은 해당 회사의 변경 이력에 운영자 이름으로 남습니다.',
        confirmLabel: '사용 시작',
        input: { label: '메모 (선택) — 계약번호 등', placeholder: '예: 2026 추가계약 #12' },
      })
      if (memo == null) return
      run(() => api(`/companies/${cid}/features/${encodeURIComponent(key)}`,
                    { method: 'PUT', body: { on: true, memo: memo || null } }),
          `${label} 을(를) 열었습니다`)
    } else {
      const ok2 = await ask({
        title: '기능 사용 중지',
        body: `<b>${esc(d.company.name)}</b> 의 <b>${esc(label)}</b> 을(를) 닫습니다.<br>`
            + '그 회사 사용자에게 더 이상 보이지 않습니다. 지금까지의 기록은 남습니다.',
        confirmLabel: '사용 중지', danger: true,
      })
      if (!ok2) return
      run(() => api(`/companies/${cid}/features/${encodeURIComponent(key)}`,
                    { method: 'PUT', body: { on: false } }),
          `${label} 을(를) 닫았습니다`)
    }
  })
}

token ? renderApp('overview') : renderLogin()
</script>
</body>
</html>
